.chapter-main-title { font-size: 2.05rem; font-weight: 800; line-height: 1.25; color: var(--text-main); margin-bottom: 1.5rem; letter-spacing: -0.02em; }

.callout-tip { border-left-color: var(--callout-tip-border); background-color: var(--callout-tip-bg); }
.callout-important { border-left-color: var(--callout-important-border); background-color: var(--callout-important-bg); }
.callout-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }

.callout-body { font-size: 0.96rem; }
.callout-body p:last-child { margin-bottom: 0; }

.table-responsive { width: 100%; overflow-x: auto; margin: 1.5rem 0; border-radius: 8px; border: 1px solid var(--table-border); }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; }
th, td { padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--table-border); border-right: 1px solid var(--table-border); vertical-align: top; }

/* App Layout, Search Modal, Citations, RTL/BiDi & Responsive Extensions */

  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 8vh;
}
.search-modal-backdrop.open { display: flex; }
.search-modal {
  width: min(720px, 92vw);
  max-height: 76vh;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
.search-modal-input-row {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.search-modal-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-main);
  font-size: 1rem;
  outline: none;
}
.search-modal-results {
  overflow-y: auto;
  padding: 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.search-result-item {
  padding: 0.7rem 0.9rem;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  text-align: start;
  background: transparent;
  color: var(--text-main);
  width: 100%;
}
.search-result-item:hover { background: var(--bg-app); border-color: var(--border-color); }
.search-result-title { font-weight: 700; font-size: 0.9rem; color: var(--primary-color); }
.search-result-snippet { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; line-height: 1.45; }
.search-highlight { background: #fef08a; color: #0f172a; padding: 0 2px; border-radius: 2px; }

/* RTL & Hebrew BiDi Isolation */
html[dir="rtl"] .article-content { direction: rtl; text-align: right; }
html[dir="rtl"] table { text-align: right; }
html[dir="rtl"] th, html[dir="rtl"] td { text-align: right; }
html[dir="rtl"] .nav-card { text-align: right; }
html[dir="rtl"] .nav-card.next-card { text-align: left; }
html[dir="rtl"] .btn-back-to-top { right: auto; left: 2rem; }
.article-content code, span[dir="ltr"], .katex { direction: ltr; unicode-bidi: isolate; }
.article-content code {
  background: var(--code-bg);
  padding: 0.12rem 0.35rem;
  border-radius: 4px;
  font-size: 0.88em;
}
.complete-chapter-divider {
  margin: 3.5rem 0 2.5rem 0;
  border: 0;
  border-top: 2px dashed var(--border-subtle);
}

/* Mobile & Tablet Android Chrome Safety */
@media (max-width: 1180px) {
  .inpage-toc { display: none; }
}
@media (max-width: 1023px) {
  body { height: auto; min-height: 100vh; overflow-y: auto; }
  .app-main { display: block; overflow: visible; }
  .app-sidebar {
    position: fixed;
    top: var(--header-height);
    bottom: 0;
    inset-inline-start: 0;
    width: min(86vw, 340px);
    transform: translateX(-105%);
    box-shadow: 4px 0 24px rgba(0,0,0,0.25);
  }
  html[dir="rtl"] .app-sidebar { transform: translateX(105%); }
  body.mobile-sidebar-open .app-sidebar { transform: translateX(0); }
  .reader-viewport { overflow: visible; padding: 1.25rem 1rem 3.5rem 1rem; display: block; }
  .header-center { display: none; }
  .brand-subtitle, .font-size-group, #btn-layout-toggle, #btn-print { display: none; }
  .chapter-nav-footer { grid-template-columns: 1fr; }
}

  </style>
</head>
<body class="font-sans layout-comfort">
  <div class="read-progress-bar" id="read-progress-bar" style="width: 0%;"></div>

  <header class="app-header">
    <div class="header-left">
      <button type="button" class="btn-icon" id="btn-toggle-sidebar" onclick="toggleSidebar()" title="Toggle Sidebar (M)" aria-label="Toggle Sidebar">&#9776;</button>
      <div class="brand-block">
        <span class="brand-title" id="ui-brand-title">OB/GYN SHLAV BET</span>
        <span class="brand-subtitle" id="ui-brand-sub">46 Chapters &bull; Gabbe &bull; Berek &amp; Novak &bull; Speroff</span>
      </div>
    </div>

    <div class="header-center">
      <button type="button" class="btn-search-trigger" onclick="openSearchModal()">
        <span id="ui-search-placeholder">Search 46 chapters, dosages, trials, tables...</span>
        <span class="kbd-hint">Ctrl+K</span>
      </button>
    </div>

    <div class="header-right">
      <button type="button" class="btn-icon" id="btn-mobile-search" onclick="openSearchModal()" title="Search">&#128269;</button>
      <button type="button" class="nav-pill-btn mode-toggle-btn" id="btn-mode-toggle" onclick="toggleBookMode()" title="Chapter vs Complete Book Mode">Single Chapter</button>
      <a class="nav-pill-btn" href="cards.html" id="ui-cards-link">&#9733; Cards &amp; Tables</a>
      <button type="button" class="nav-pill-btn active-lang" id="btn-lang-toggle" onclick="toggleLanguage()" title="Switch EN / HE (Alt+L)">EN / עב</button>

      <div class="font-size-group">
        <button type="button" class="btn-icon-sm" onclick="adjustFontSize(-1)" title="Decrease Font">A-</button>
        <span class="font-size-label" id="font-size-label">16px</span>
        <button type="button" class="btn-icon-sm" onclick="adjustFontSize(1)" title="Increase Font">A+</button>
      </div>

      <button type="button" class="btn-icon-sm" id="btn-layout-toggle" onclick="toggleWidth()" title="Comfort / Full Width">&#8596;</button>

      <div class="theme-buttons" aria-label="Theme">
        <button type="button" class="btn-theme-swatch theme-btn-light active" data-theme="light" onclick="setTheme('light')" title="Day"></button>
        <button type="button" class="btn-theme-swatch theme-btn-sepia" data-theme="sepia" onclick="setTheme('sepia')" title="Sepia"></button>
        <button type="button" class="btn-theme-swatch theme-btn-dark" data-theme="dark" onclick="setTheme('dark')" title="Night"></button>
      </div>

      <button type="button" class="btn-icon-sm" id="btn-print" onclick="window.print()" title="Print / Save PDF">PDF</button>
    </div>
  </header>

  <div class="app-main">
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <div class="sidebar-top-row">
          <span id="ui-curriculum-label">SHLAV BET SYLLABUS</span>
          <span class="badge-total" id="ui-total-badge">46 CH</span>
        </div>
        <input type="text" class="sidebar-filter-input" id="sidebar-filter" oninput="filterSidebar(this.value)" placeholder="Filter chapters..." />
        <div class="sidebar-progress-wrap">
          <span id="ui-progress-text">0 / 46 completed (0%)</span>
          <div class="sidebar-progress-bar"><div class="sidebar-progress-fill" id="sidebar-progress-fill"></div></div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>

    <main class="reader-viewport" id="reader-viewport" onscroll="handleViewportScroll()">
      <div class="reader-container" id="reader-container"></div>
      <aside class="inpage-toc" id="inpage-toc">
        <div class="inpage-toc-title" id="ui-toc-title">On This Page</div>
        <ul class="inpage-toc-list" id="inpage-toc-list"></ul>
      </aside>
    </main>
  </div>

  <button type="button" class="btn-reopen-sidebar" onclick="toggleSidebar()" id="btn-reopen-sidebar">&#9776; Menu</button>
  <button type="button" class="btn-back-to-top" id="btn-back-to-top" onclick="scrollToTop()" title="Back to top">&#8593;</button>

  <div class="citation-popover" id="citation-popover" role="dialog">
    <div class="citation-popover-label" id="citation-popover-label">SOURCE CITATION</div>
    <div id="citation-popover-body"></div>
  </div>

  <div class="search-modal-backdrop" id="search-modal-backdrop" onclick="if(event.target===this) closeSearchModal()">
    <div class="search-modal">
      <div class="search-modal-input-row">
        <span>&#128269;</span>
        <input type="text" class="search-modal-input" id="search-modal-input" oninput="runGlobalSearch(this.value)" placeholder="Search across all 46 chapters..." />
        <button type="button" class="btn-icon-sm" onclick="closeSearchModal()">Esc</button>
      </div>
      <div class="search-modal-results" id="search-modal-results"></div>
    </div>
  </div>

  <script src="book_data_en.js"></script>
  <script src="book_data_he.js"></script>

  <script>
    const MANIFEST_TOPICS = [{"id": "01_MFM", "num": 1, "title_en": "Topic 1: Maternal-Fetal Medicine & High-Risk Obstetrics", "title_he": "תחום 1: רפואת האם והעובר ומיילדות בסיכון גבוה (MFM)", "short_en": "Maternal-Fetal Medicine", "short_he": "רפואת האם והעובר", "icon": "🤰"}, {"id": "02_Ultrasound_Prenatal", "num": 2, "title_en": "Topic 2: OB/GYN Ultrasound & Prenatal Diagnosis", "title_he": "תחום 2: אולטרסאונד במיילדות וגינקולוגיה ואבחון טרום-לידתי", "short_en": "Ultrasound & Prenatal Dx", "short_he": "אולטרסאונד ואבחון טרום-לידתי", "icon": "🖥️"}, {"id": "03_REI", "num": 3, "title_en": "Topic 3: Reproductive Endocrinology & Infertility (REI)", "title_he": "תחום 3: אנדוקרינולוגיה של הרבייה ופריון (REI)", "short_en": "REI & Infertility", "short_he": "אנדוקרינולוגיה ופריון", "icon": "🧬"}, {"id": "04_Gyn_Oncology", "num": 4, "title_en": "Topic 4: Gynecologic Oncology", "title_he": "תחום 4: גינקולוגיה אונקולוגית", "short_en": "Gyn Oncology", "short_he": "גינקולוגיה אונקולוגית", "icon": "🔬"}, {"id": "05_Urogynecology", "num": 5, "title_en": "Topic 5: Urogynecology & Pelvic Floor Reconstructive Surgery", "title_he": "תחום 5: אורוגינקולוגיה וכירורגיה משקמת של רצפת האגן", "short_en": "Urogynecology", "short_he": "אורוגינקולוגיה", "icon": "🩺"}, {"id": "06_General_Gyn_MIGS", "num": 6, "title_en": "Topic 6: General Gynecology & Minimally Invasive Surgery (MIGS)", "title_he": "תחום 6: גינקולוגיה כללית וכירורגיה זעיר-פולשנית (MIGS)", "short_en": "General Gyn & MIGS", "short_he": "גינקולוגיה ו-MIGS", "icon": "🔧"}, {"id": "07_PAG", "num": 7, "title_en": "Topic 7: Pediatric & Adolescent Gynecology (PAG)", "title_he": "תחום 7: גינקולוגיה של ילדות ומתבגרות (PAG)", "short_en": "Pediatric & Adolescent Gyn", "short_he": "גינקולוגיית ילדות ומתבגרות", "icon": "🌸"}];
    let currentLang = localStorage.getItem('obgyn_reader_lang') || 'en';
    let currentChapterNum = parseInt(localStorage.getItem('obgyn_reader_ch') || '1', 10);
    if (isNaN(currentChapterNum) || currentChapterNum < 1 || currentChapterNum > 46) currentChapterNum = 1;
    let bookMode = localStorage.getItem('obgyn_reader_mode') || 'chapter'; // 'chapter' | 'complete'
    let currentTheme = localStorage.getItem('obgyn_reader_theme') || 'light';
    let currentWidth = localStorage.getItem('obgyn_reader_width') || 'comfort';
    let fontSize = parseInt(localStorage.getItem('obgyn_reader_font') || '16', 10);
    let readProgress = JSON.parse(localStorage.getItem('obgyn_reader_done') || '{}');
    let openTopics = JSON.parse(localStorage.getItem('obgyn_reader_open_topics') || '["01_MFM"]');

    function getBookArray(lang) {
      if (lang === 'he' && window.BOOK_DATA_HE) return window.BOOK_DATA_HE;
      if (window.BOOK_DATA_EN) return window.BOOK_DATA_EN;
      return window.BOOK_DATA_HE || [];
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function updateChromeLabels() {
      const isHe = currentLang === 'he';
      document.documentElement.lang = isHe ? 'he' : 'en';
      document.documentElement.dir = isHe ? 'rtl' : 'ltr';
      document.getElementById('ui-brand-title').textContent = isHe ? 'מיילדות וגינקולוגיה — שלב ב׳' : 'OB/GYN SHLAV BET';
      document.getElementById('ui-brand-sub').textContent = isHe
        ? '46 פרקים • Gabbe 8th • Berek 17th • Speroff 9th • הנחיות האיגוד הישראלי'
        : '46 Chapters • Gabbe 8th • Berek & Novak 17th • Speroff 9th • Israeli Society';
      document.getElementById('ui-search-placeholder').textContent = isHe
        ? 'חיפוש בכל 46 הפרקים, מינונים, מחקרים וטבלאות...'
        : 'Search 46 chapters, dosages, trials, tables...';
      document.getElementById('ui-cards-link').textContent = isHe ? '★ כרטיסיות וטבלאות' : '★ Cards & Tables';
      document.getElementById('btn-lang-toggle').textContent = isHe ? 'עברית | EN' : 'EN | עברית';
      document.getElementById('btn-mode-toggle').textContent = bookMode === 'complete'
        ? (isHe ? 'מצב ספר מלא' : 'Complete Book')
        : (isHe ? 'מצב פרק בודד' : 'Single Chapter');
      document.getElementById('btn-mode-toggle').classList.toggle('active', bookMode === 'complete');
      document.getElementById('ui-curriculum-label').textContent = isHe ? 'סילבוס שלב ב׳' : 'SHLAV BET SYLLABUS';
      document.getElementById('sidebar-filter').placeholder = isHe ? 'סינון פרקים...' : 'Filter chapters...';
      document.getElementById('ui-toc-title').textContent = isHe ? 'תוכן העניינים' : 'On This Page';
      document.getElementById('btn-reopen-sidebar').textContent = isHe ? '☰ תפריט' : '☰ Menu';
      document.getElementById('citation-popover-label').textContent = isHe ? 'מקור ביבליוגרפי' : 'SOURCE CITATION';
      document.getElementById('search-modal-input').placeholder = isHe ? 'חיפוש בכל 46 הפרקים...' : 'Search across all 46 chapters...';
      updateProgressStats();
    }

    function updateProgressStats() {
      const doneCount = Object.values(readProgress).filter(Boolean).length;
      const pct = Math.round((doneCount / 46) * 100);
      const isHe = currentLang === 'he';
      document.getElementById('ui-progress-text').textContent = isHe
        ? `${doneCount} / 46 פרקים הושלמו (${pct}%)`
        : `${doneCount} / 46 completed (${pct}%)`;
      document.getElementById('sidebar-progress-fill').style.width = `${pct}%`;
    }

    function renderSidebar(filterText = '') {
      const data = getBookArray(currentLang);
      const nav = document.getElementById('sidebar-nav');
      const isHe = currentLang === 'he';
      const q = filterText.trim().toLowerCase();
      let html = '';

      for (const topic of MANIFEST_TOPICS) {
        const tChapters = data.filter(c => c.topic_id === topic.id && (
          !q || c.title.toLowerCase().includes(q) || String(c.num).padStart(2, '0').includes(q)
        ));
        if (q && tChapters.length === 0) continue;
        const isOpen = q ? true : openTopics.includes(topic.id);
        const tTitle = isHe ? topic.title_he : topic.title_en;
        html += `<div class="topic-group ${isOpen ? 'open' : ''}" data-topic="${topic.id}">`;
        html += `<div class="topic-header" onclick="toggleTopic('${topic.id}')">
          <div class="topic-title-block"><span>${topic.icon || ''}</span><span>${escapeHtml(tTitle)}</span></div>
          <span class="topic-toggle-arrow">&#9662;</span>
        </div>`;
        html += `<ul class="topic-chapters">`;
        for (const ch of tChapters) {
          const active = (bookMode === 'chapter' && ch.num === currentChapterNum) ? 'active' : '';
          const doneCls = readProgress[ch.num] ? 'done' : '';
          const wBadge = ch.words ? `${(ch.words / 1000).toFixed(1)}k` : '—';
          html += `<li><a href="#ch-${ch.num}" class="chapter-nav-item ${active}" onclick="selectChapter(${ch.num}); return false;">
            <span class="ch-check-dot ${doneCls}"></span>
            <span class="ch-num">${String(ch.num).padStart(2, '0')}</span>
            <span class="ch-title">${escapeHtml(ch.title)}</span>
            <span class="ch-badge-words">${wBadge}</span>
          </a></li>`;
        }
        html += `</ul></div>`;
      }
      nav.innerHTML = html;
    }

    function toggleTopic(topicId) {
      if (openTopics.includes(topicId)) {
        openTopics = openTopics.filter(t => t !== topicId);
      } else {
        openTopics.push(topicId);
      }
      localStorage.setItem('obgyn_reader_open_topics', JSON.stringify(openTopics));
      renderSidebar(document.getElementById('sidebar-filter').value);
    }

    function filterSidebar(val) { renderSidebar(val); }

    function renderChapterBlock(ch, isCompleteMode) {
      const isHe = currentLang === 'he';
      const sourcesHtml = (ch.sources || []).map(s => `<span class="badge badge-sources">${escapeHtml(s)}</span>`).join(' ');
      const done = !!readProgress[ch.num];
      const doneBtnLabel = done
        ? (isHe ? '✓ הושלם' : '✓ Completed')
        : (isHe ? 'סמן כהושלם' : 'Mark Completed');
      const wordLabel = isHe ? `${ch.words.toLocaleString()} מילים` : `${ch.words.toLocaleString()} words`;
      const timeLabel = isHe ? `~${ch.read_mins} דק׳ קריאה` : `~${ch.read_mins} min read`;

      return `
        <article class="chapter-article" id="chapter-block-${ch.num}">
          <div class="reader-meta-header">
            <div class="reader-breadcrumbs">${escapeHtml(ch.topic_title)} &rsaquo; ${isHe ? 'פרק' : 'Chapter'} ${String(ch.num).padStart(2, '0')}</div>
            <div class="reader-badges">
              <span class="badge badge-topic">${escapeHtml(ch.topic_title)}</span>
              <span class="badge badge-words">${wordLabel}</span>
              <span class="badge badge-readtime">${timeLabel}</span>
              ${sourcesHtml}
              <button type="button" class="btn-mark-read ${done ? 'completed' : ''}" onclick="toggleChapterDone(${ch.num})">${doneBtnLabel}</button>
            </div>
          </div>
          <h1 class="chapter-main-title">${String(ch.num).padStart(2, '0')}. ${escapeHtml(ch.title)}</h1>
          <div class="article-content">${ch.html}</div>
        </article>
      `;
    }

    function renderReader() {
      const data = getBookArray(currentLang);
      const container = document.getElementById('reader-container');
      const tocList = document.getElementById('inpage-toc-list');
      const isHe = currentLang === 'he';

      if (bookMode === 'complete') {
        container.innerHTML = data.map((ch, idx) =>
          renderChapterBlock(ch, true) + (idx < data.length - 1 ? '<hr class="complete-chapter-divider" />' : '')
        ).join('');
        tocList.innerHTML = data.map(ch =>
          `<li class="inpage-toc-item"><a href="#chapter-block-${ch.num}">${String(ch.num).padStart(2, '0')}. ${escapeHtml(ch.title)}</a></li>`
        ).join('');
      } else {
        const idx = data.findIndex(c => c.num === currentChapterNum);
        const ch = idx >= 0 ? data[idx] : data[0];
        if (!ch) { container.innerHTML = '<p>No chapters loaded.</p>'; return; }
        const prev = idx > 0 ? data[idx - 1] : null;
        const next = idx < data.length - 1 ? data[idx + 1] : null;
        let navFooter = '<div class="chapter-nav-footer">';
        navFooter += prev
          ? `<button type="button" class="nav-card" onclick="selectChapter(${prev.num})"><span class="nav-dir">${isHe ? '→ הפרק הקודם' : '← Previous'}</span><span class="nav-card-title">${String(prev.num).padStart(2, '0')}. ${escapeHtml(prev.title)}</span></button>`
          : '<div></div>';
        navFooter += next
          ? `<button type="button" class="nav-card next-card" onclick="selectChapter(${next.num})"><span class="nav-dir">${isHe ? 'הפרק הבא ←' : 'Next →'}</span><span class="nav-card-title">${String(next.num).padStart(2, '0')}. ${escapeHtml(next.title)}</span></button>`
          : '<div></div>';
        navFooter += '</div>';

        container.innerHTML = renderChapterBlock(ch, false) + navFooter;
        tocList.innerHTML = (ch.toc || []).map(item =>
          `<li class="inpage-toc-item toc-level-${item.level}"><a href="#${item.id}">${escapeHtml(item.text)}</a></li>`
        ).join('');
      }

      renderSidebar(document.getElementById('sidebar-filter').value);
      bindCitations();
      renderMath();
      document.getElementById('reader-viewport').scrollTop = 0;
      window.scrollTo(0, 0);
    }

    function selectChapter(num) {
      currentChapterNum = num;
      localStorage.setItem('obgyn_reader_ch', String(num));
      const data = getBookArray(currentLang);
      const ch = data.find(c => c.num === num);
      if (ch && !openTopics.includes(ch.topic_id)) {
        openTopics.push(ch.topic_id);
        localStorage.setItem('obgyn_reader_open_topics', JSON.stringify(openTopics));
      }
      if (bookMode === 'complete') {
        const el = document.getElementById('chapter-block-' + num);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      } else {
        renderReader();
      }
      document.body.classList.remove('mobile-sidebar-open');
    }

    function toggleChapterDone(num) {
      readProgress[num] = !readProgress[num];
      localStorage.setItem('obgyn_reader_done', JSON.stringify(readProgress));
      updateProgressStats();
      renderReader();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'he' : 'en';
      localStorage.setItem('obgyn_reader_lang', currentLang);
      updateChromeLabels();
      renderReader();
    }

    function toggleBookMode() {
      bookMode = bookMode === 'chapter' ? 'complete' : 'chapter';
      localStorage.setItem('obgyn_reader_mode', bookMode);
      updateChromeLabels();
      renderReader();
    }

    function toggleSidebar() {
      if (window.innerWidth < 1024) {
        document.body.classList.toggle('mobile-sidebar-open');
      } else {
        document.body.classList.toggle('sidebar-collapsed');
      }
    }

    function setTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('obgyn_reader_theme', theme);
      document.body.classList.remove('theme-sepia', 'theme-dark');
      if (theme === 'sepia') document.body.classList.add('theme-sepia');
      if (theme === 'dark') document.body.classList.add('theme-dark');
      document.querySelectorAll('.btn-theme-swatch').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
      });
    }

    function adjustFontSize(delta) {
      fontSize = Math.min(22, Math.max(13, fontSize + delta));
      localStorage.setItem('obgyn_reader_font', String(fontSize));
      document.documentElement.style.setProperty('--font-base-size', fontSize + 'px');
      document.getElementById('font-size-label').textContent = fontSize + 'px';
    }

    function toggleWidth() {
      currentWidth = currentWidth === 'comfort' ? 'full' : 'comfort';
      localStorage.setItem('obgyn_reader_width', currentWidth);
      document.body.classList.toggle('layout-comfort', currentWidth === 'comfort');
      document.body.classList.toggle('layout-full', currentWidth === 'full');
    }

    function handleViewportScroll() {
      const vp = document.getElementById('reader-viewport');
      const st = vp.scrollTop;
      const sh = vp.scrollHeight - vp.clientHeight;
      const pct = sh > 0 ? Math.min(100, Math.round((st / sh) * 100)) : 0;
      document.getElementById('read-progress-bar').style.width = pct + '%';
      document.getElementById('btn-back-to-top').classList.toggle('visible', st > 320);
    }

    function scrollToTop() {
      document.getElementById('reader-viewport').scrollTo({ top: 0, behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function bindCitations() {
      const pop = document.getElementById('citation-popover');
      const body = document.getElementById('citation-popover-body');
      document.querySelectorAll('.citation-pill').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          body.textContent = btn.getAttribute('data-cite');
          const rect = btn.getBoundingClientRect();
          pop.style.display = 'block';
          const top = Math.min(window.innerHeight - 160, rect.bottom + 8);
          const left = Math.max(12, Math.min(window.innerWidth - 395, rect.left - 80));
          pop.style.top = top + 'px';
          pop.style.left = left + 'px';
        };
      });
    }

    document.addEventListener('click', (e) => {
      const pop = document.getElementById('citation-popover');
      if (pop.style.display === 'block' && !pop.contains(e.target)) {
        pop.style.display = 'none';
      }
    });

    function renderMath() {
      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(document.getElementById('reader-container'), {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false
          });
        } catch (e) {}
      }
    }

    function openSearchModal() {
      document.getElementById('search-modal-backdrop').classList.add('open');
      const inp = document.getElementById('search-modal-input');
      inp.focus();
      runGlobalSearch(inp.value);
    }

    function closeSearchModal() {
      document.getElementById('search-modal-backdrop').classList.remove('open');
    }

    function runGlobalSearch(query) {
      const q = query.trim();
      const resEl = document.getElementById('search-modal-results');
      const data = getBookArray(currentLang);
      const isHe = currentLang === 'he';
      if (q.length < 2) {
        resEl.innerHTML = `<div style="padding:1rem;color:var(--text-muted);font-size:0.85rem;">${
          isHe ? 'הקלד לפחות 2 תווים לחיפוש בכל 46 הפרקים...' : 'Type at least 2 characters to search across all 46 chapters...'
        }</div>`;
        return;
      }
      const ql = q.toLowerCase();
      const matches = [];
      for (const ch of data) {
        const titleHit = ch.title.toLowerCase().includes(ql);
        const bodyIdx = ch.search_text.toLowerCase().indexOf(ql);
        if (titleHit || bodyIdx !== -1) {
          let snippet = '';
          if (bodyIdx !== -1) {
            const start = Math.max(0, bodyIdx - 70);
            const end = Math.min(ch.search_text.length, bodyIdx + q.length + 110);
            snippet = (start > 0 ? '...' : '') + escapeHtml(ch.search_text.slice(start, end)) + (end < ch.search_text.length ? '...' : '');
            const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
            snippet = snippet.replace(re, '<span class="search-highlight">$1</span>');
          }
          matches.push({ ch, snippet, score: (titleHit ? 2 : 0) + (bodyIdx !== -1 ? 1 : 0) });
        }
      }
      matches.sort((a, b) => b.score - a.score);
      if (!matches.length) {
        resEl.innerHTML = `<div style="padding:1rem;color:var(--text-muted);">${isHe ? 'לא נמצאו תוצאות.' : 'No matching chapters found.'}</div>`;
        return;
      }
      resEl.innerHTML = matches.slice(0, 30).map(m => `
        <button type="button" class="search-result-item" onclick="jumpToSearchResult(${m.ch.num})">
          <div class="search-result-title">${String(m.ch.num).padStart(2, '0')}. ${escapeHtml(m.ch.title)} <span style="font-weight:400;color:var(--text-muted);font-size:0.78rem;">(${escapeHtml(m.ch.topic_title)})</span></div>
          ${m.snippet ? `<div class="search-result-snippet">${m.snippet}</div>` : ''}
        </button>
      `).join('');
    }

    function jumpToSearchResult(num) {
      closeSearchModal();
      selectChapter(num);
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openSearchModal();
      } else if (e.altKey && e.key.toLowerCase() === 'l') {
        e.preventDefault();
        toggleLanguage();
      } else if (e.key === 'Escape') {
        closeSearchModal();
        document.getElementById('citation-popover').style.display = 'none';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setTheme(currentTheme);
      document.body.classList.toggle('layout-comfort', currentWidth === 'comfort');
      document.body.classList.toggle('layout-full', currentWidth === 'full');
      document.documentElement.style.setProperty('--font-base-size', fontSize + 'px');
      document.getElementById('font-size-label').textContent = fontSize + 'px';
      updateChromeLabels();
      renderReader();
    });
  </script>
</body>
</html>
